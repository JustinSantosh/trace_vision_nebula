# TRACEVISION pipeline settings: one place for thresholds and weights.
# Values marked (calibrated) are set by `python -m tracevision.calibrate` and recorded in its report.

fusion:
  tau_share: 0.6          # min share of the weighted vote for a character at a position
  tau_prob: 0.8           # min quality-weighted mean OCR probability for that character
  min_support: 1          # min number of reads covering a position
  cross_class_weight: 0.5 # weight of a look-alike vote from the wrong class (e.g. '0' at a letter position -> 'O')
  use_top3: true          # alternatives (top-3) also vote, with their own probabilities

pipeline:
  detect_every: 2            # run detection + tracking on every Nth frame
  vehicle_conf: 0.25
  imgsz: 640                 # UVH-26 was trained at 640
  min_track_dets: 5          # shorter tracks are dropped
  min_vehicle_area_frac: 0.004   # a track must reach this fraction of the frame at least once (skips far specks)
  relink_gap_frames: 30      # join track B to track A if B starts within this many frames after A ends ...
  relink_max_center_dist: 1.0    # ... and B's first box centre is within this many A-box diagonals of A's last box
  candidate_frames: 8        # frames per track examined for a plate
  min_frame_gap: 4           # candidate frames at least this far apart
  ocr_top_k: 5               # best plate crops per track sent to OCR
  colour_frames: 3
  verify_large_frac: 0.10    # C11: tracks whose median box covers >= this fraction of the frame are cross-checked ...
  verify_samples: 6          # ... on up to this many evenly spaced frames with COCO YOLOv8n ...
  verify_min_iou: 0.3        # ... a COCO car/truck/bus/motorcycle/bicycle box must overlap the track box this much ...
  verify_min_share: 0.34     # ... in at least this share of the sampled frames, else the track is dropped (logged)
  ensemble_coco: true         # C13 / M15: second tracking pass with COCO YOLOv8n (close-up / ground-level vehicles) ...
  ensemble_match_iou: 0.5     # ... a COCO track overlapping a UVH-26 track this much (mean IoU) is the same vehicle (type vote)
  ensemble_new_conf: 0.5      # ... a COCO track overlapping none is added if its mean confidence is at least this
  fold_duplicates: false       # M18: nested-duplicate folding in the pipeline stays OFF (it split a wrong-way track); crosscam folds
  plate_link_min_known: 6    # merge tracks whose fused plates agree on >= this many readable characters (and never disagree)

colour:
  method: clip_masked       # clip_masked = CLIP on vehicle pixels only (YOLOv8n-seg mask, M17); clip = whole box (M13); heuristic = hue rules

plate_detector:
  conf: 0.5               # DECISIONS M8
  min_plate_height_px: 16 # below this the plate is reported unreadable, never OCR'd (M8)

match:
  weights: {plate: 0.70, colour: 0.15, type: 0.15}
  lookalike_cost: 0.4     # substitution cost between look-alike characters (0/O/D/Q, 1/I, 2/Z, 5/S, 8/B, 6/G)
  min_known_for_match: 5  # fewer readable plate characters than this -> never a confident single match
  t_abs: 67.5             # (calibrated) top match score below this -> "no confident match"
  t_margin: 4.0           # (calibrated) top score minus 2nd below this -> "ambiguous"
  top_k: 5
  min_plate_sim_candidate: 0.5  # candidates below this plate similarity are dropped, unless the plate is mostly unknown
